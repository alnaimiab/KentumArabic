name: CI

on:
  push:
    tags: ['v*']
    # The repository's default branch is master, not main. Naming the wrong one here does not
    # fail loudly - the workflow simply never runs, and the checks look green because nothing
    # ever reported.
    branches: [master]
  pull_request:

jobs:
  # Translation files are edited by translators, not programmers, so the checks that matter
  # most run first and need no game install: a lost {0} placeholder or an unbalanced <color>
  # tag breaks the game at runtime and is invisible in a spreadsheet.
  validate-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install --quiet fonttools

      - name: Validate TSV translation files
        run: python tools/validate_tsv.py content/strings

      # One term rendered two ways is the clearest sign nobody was minding the text.
      - name: Enforce the glossary
        run: python tools/check_terms.py content/strings

      # TextMeshPro has no mark-to-base positioning, so a diacritic is drawn at the pen position
      # instead of on its letter. It looks like the text will not sit still, and no font fixes it.
      - name: Reject diacritics TextMeshPro cannot position
        run: python tools/strip_tashkeel.py content/strings --check

      - name: Verify fonts can render shaped Arabic
        run: |
          python tools/check_font_coverage.py "content/fonts/*.ttf" \
            --text "content/strings/*.tsv"

      # Windows PowerShell 5.1 decodes .ps1 with the system ANSI code page unless the file has a
      # UTF-8 BOM, so a non-ASCII byte becomes mojibake that can break parsing outright. It works
      # on a developer machine with the UTF-8 code page beta enabled and nowhere else, which makes
      # it exactly the kind of thing a machine has to check.
      - name: Player-facing scripts must be ASCII
        run: python tools/check_scripts_ascii.py scripts

      # --check-tag on tag builds only. On a branch the version may legitimately be ahead of
      # the newest tag while a release is being prepared; on a tag it must not be.
      - name: Plugin version must match the manifest
        run: python tools/check_version_sync.py

      - name: On a tag, the version must have a matching tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --tags --force
          python tools/check_version_sync.py --check-tag

      # The release page is the only documentation most players read. It is generated from a
      # template so it stays about installing and playing rather than drifting into a list of
      # internal faults, and the one line that varies has to actually be there.
      - name: Release notes must render
        run: python tools/release_notes.py --check

      - name: Ensure no game content is committed
        run: |
          # _dump/ holds Tlön Industries' original English and Spanish text. It must never
          # be published; the repo carries keys and the Arabic column only.
          if git ls-files | grep -E '(^|/)_dump/' ; then
            echo "::error::_dump/ is committed. It contains the developer's copyrighted source text."
            exit 1
          fi
          if git ls-files | grep -iE '\.(unity3d|assets|resource)$|Tlon\..*\.dll|PixelCrushers\.dll' ; then
            echo "::error::Game assets or assemblies are committed. These must never be redistributed."
            exit 1
          fi
          echo "No game content committed."

  # The shaping pipeline is pure string -> string, so it is fully testable without Unity or
  # the game. This is what catches rich-text and bidi regressions.
  shaping-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Passing content/strings runs every shipped string through the real shaper, not just the
      # hand-picked cases. The placeholder bug that broke the Load screen shipped precisely
      # because no hand-picked case happened to contain "{0}" — this closes that gap for good,
      # and makes new content with unfamiliar markup fail here instead of in the player's game.
      - name: Run shaping regression suite over the full corpus
        run: dotnet run --project tools/ShaperTest -c Release -- content/strings

  # The plugin itself only builds against a real Kentum install (its assemblies are referenced,
  # never redistributed), so this job checks what it can without one.
  build-plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Confirm the build fails cleanly without the game
        shell: pwsh
        run: |
          $out = dotnet build src/KentumArabic -c Release 2>&1 | Out-String
          if ($out -match 'Kentum managed assemblies not found') {
            Write-Host "Build guard works: a missing game install produces an actionable error."
            exit 0
          }
          Write-Host $out
          Write-Host "::error::Expected the KENTUM_DIR guard to fire on a runner with no game install."
          exit 1
